<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="IKAY: dashboard about your digital fingerprint" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#faf8f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16150f" media="(prefers-color-scheme: dark)" />
    <title>Tu navegador dice...</title>
    <link rel="icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400..700&family=Fraunces:ital,opsz,wght@0,9..144,400..800;1,9..144,400..700&family=Inter+Tight:wght@400..700&family=Noto+Sans+Arabic:wght@400..700&display=swap"
      rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/app.css" />
    <link rel="modulepreload" href="assets/js/i18n.js" />
    <script type="module" src="assets/js/app.js"></script>
  </head>

  <body class="loadingEnable">
    <!-- NO JS -->
    <noscript id="nojs">
      <p lang="en">
        The javascript of your browser is disabled, you are safe :D
      </p>
      <p lang="es">
        El javascript de su navegador está deshabilitado, estás a salvo :D
      </p>
      <p lang="ar" dir="rtl">تم تعطيل جافا سكريبت في متصفحك، أنت في أمان :D</p>
    </noscript>

    <!-- PROGRESS (reading the browser) -->
    <div id="loadingPage" class="js-loadingPage"></div>

    <!-- APP CONTENT -->
    <header id="appHeader" class="header"></header>
    <main id="appMain" class="main" tabindex="-1"></main>
    <footer id="appFooter" class="footer"></footer>

    <!-- CARD MODAL (<dialog>) -->
    <div id="caimodal"></div>

    <!-- SHARE -->
    <aside id="shareTime" class="sharetime"></aside>

    <!--
      ===================================================================
      TEMPLATES
      Inert markup cloned by assets/js/modules/template.js.
      Texts come from assets/locales/*.json through the data-i18n attributes:
        data-i18n="a.b"                 -> textContent
        data-i18n-html="a.b"            -> innerHTML (trusted translations)
        data-i18n-attr="title:a.b;..."  -> attributes
      data-skeleton marks a placeholder ("...") shown as a loading skeleton
      until a detector fills it (see card.js).
      ===================================================================
    -->

    <!-- HEADER -->
    <template id="tpl-header">
      <a class="skiplink" href="#appMain" data-i18n="global.skip"></a>
      <div class="header__bar">
        <a class="header__linkHome" href="#">
          <span class="header__logo" aria-hidden="true">
            <span class="iconbg iconbg-logo"></span>
          </span>
          <span class="header__info">
            <span class="header__h1" data-i18n="header.h1"></span>
            <span class="header__description" data-i18n="header.description"></span>
          </span>
        </a>
        <button
          type="button"
          class="header__btnMenu js-bntMenu"
          popovertarget="navMenu"
          aria-controls="navMenu"
          aria-expanded="false"
          data-i18n-attr="aria-label:global.menu;title:global.menu">
          <span class="iconbg iconbg-menu" aria-hidden="true"></span>
        </button>
      </div>

      <nav id="navMenu" class="nav js-navMenu" popover data-i18n-attr="aria-label:global.sections">
        <div class="nav__top">
          <span class="nav__heading" data-i18n="global.sections"></span>
          <button
            type="button"
            class="nav__btnMenuClose js-bntMenuClose"
            popovertarget="navMenu"
            popovertargetaction="hide"
            data-i18n-attr="aria-label:global.close;title:global.close">
            <span class="iconbg iconbg-close" aria-hidden="true"></span>
          </button>
        </div>

        <ul class="nav__list">
          <li class="nav__list__item">
            <a href="#areaId" class="link js-navMenu-link">
              <span class="nav__icon iconbg iconbg-fingerprint" aria-hidden="true"></span>
              <span class="text" data-i18n="header.id"></span>
            </a>
          </li>
          <li class="nav__list__item">
            <a href="#areaLocation" class="link js-navMenu-link">
              <span class="nav__icon iconbg iconbg-location" aria-hidden="true"></span>
              <span class="text" data-i18n="header.location"></span>
            </a>
          </li>
          <li class="nav__list__item">
            <a href="#areaInfo" class="link js-navMenu-link">
              <span class="nav__icon iconbg iconbg-info" aria-hidden="true"></span>
              <span class="text" data-i18n="header.info"></span>
            </a>
          </li>
          <li class="nav__list__item">
            <a href="#areaEnvironment" class="link js-navMenu-link">
              <span class="nav__icon iconbg iconbg-timezone" aria-hidden="true"></span>
              <span class="text" data-i18n="header.environment"></span>
            </a>
          </li>
          <li class="nav__list__item">
            <a href="#areaSoftware" class="link js-navMenu-link">
              <span class="nav__icon iconbg iconbg-os" aria-hidden="true"></span>
              <span class="text" data-i18n="header.software"></span>
            </a>
          </li>
          <li class="nav__list__item">
            <a href="#areaConnection" class="link js-navMenu-link">
              <span class="nav__icon iconbg iconbg-connection" aria-hidden="true"></span>
              <span class="text" data-i18n="header.connection"></span>
            </a>
          </li>
          <li class="nav__list__item">
            <a href="#areaHardware" class="link js-navMenu-link">
              <span class="nav__icon iconbg iconbg-hardware" aria-hidden="true"></span>
              <span class="text" data-i18n="header.hardware"></span>
            </a>
          </li>
          <li class="nav__list__item">
            <a href="#areaBattery" class="link js-navMenu-link">
              <span class="nav__icon iconbg iconbg-battery" aria-hidden="true"></span>
              <span class="text" data-i18n="header.battery"></span>
            </a>
          </li>
          <li class="nav__list__item">
            <a href="#areaFingerprints" class="link js-navMenu-link">
              <span class="nav__icon iconbg iconbg-canvas" aria-hidden="true"></span>
              <span class="text" data-i18n="header.fingerprints"></span>
            </a>
          </li>
          <li class="nav__list__item">
            <a href="#areaPrivacy" class="link js-navMenu-link">
              <span class="nav__icon iconbg iconbg-incognito" aria-hidden="true"></span>
              <span class="text" data-i18n="header.privacy"></span>
            </a>
          </li>
          <li class="nav__list__item">
            <a href="#areaBehaviour" class="link js-navMenu-link">
              <span class="nav__icon iconbg iconbg-behaviour" aria-hidden="true"></span>
              <span class="text" data-i18n="header.behaviour"></span>
            </a>
          </li>
        </ul>

        <ul class="nav__list nav__list--secondary">
          <li class="nav__list__item">
            <a href="#areaAbout" class="link js-navMenu-link">
              <span class="nav__icon iconbg iconbg-project" aria-hidden="true"></span>
              <span class="text" data-i18n="header.aboutme"></span>
            </a>
          </li>
          <li class="nav__list__item">
            <button type="button" class="link js-share-native">
              <span class="nav__icon iconbg iconbg-share" aria-hidden="true"></span>
              <span class="text" data-i18n="header.share"></span>
            </button>
          </li>
          <li class="nav__list__item">
            <a href="https://github.com/nandovejer/ikay-vanilla" class="link">
              <span class="nav__icon iconbg iconbg-browser" aria-hidden="true"></span>
              <span class="text" data-i18n="global.github"></span>
            </a>
          </li>
        </ul>

        <!-- CHOICE LANG: buttons filled by choiceLang.js -->
        <div class="nav__lang" role="group" aria-labelledby="navLangLabel">
          <span id="navLangLabel" class="nav__lang__label" data-i18n="global.language"></span>
          <div class="nav__lang__options js-choiceLang"></div>
        </div>
      </nav>
    </template>

    <template id="tpl-lang-btn">
      <button type="button" class="nav__lang__btn js-choiceLang-btn">
        <span class="nav__lang__code"></span>
        <span class="nav__lang__name"></span>
      </button>
    </template>

    <!-- MAIN -->
    <template id="tpl-main">
      <!-- HERO: intro + your ID + summary -->
      <div class="hero">
        <span class="hero__mark iconbg iconbg-logo" aria-hidden="true"></span>
        <div class="hero__intro">
          <p class="hero__eyebrow" data-i18n="summary.eyebrow"></p>
          <h1 class="hero__title" data-i18n="main.intro.heading"></h1>
          <div class="hero__text" data-i18n-html="main.intro.content1"></div>
          <div class="hero__text" data-i18n-html="main.intro.content2"></div>
        </div>

        <section class="area area--id" data-cards="fingerprint" aria-labelledby="areaId">
          <h2 tabindex="-1" id="areaId" class="area--id__title" data-i18n="header.id"></h2>
          <div class="js-cards"></div>
        </section>

        <section class="summary js-summary" aria-labelledby="summaryTitle">
          <h2 id="summaryTitle" class="summary__title" data-i18n="summary.title"></h2>
          <dl class="summary__stats">
            <div class="summary__stat">
              <dt data-i18n="summary.points"></dt>
              <dd>
                <span class="summary__number js-summary-points">0</span>
                <span class="summary__of js-summary-total"></span>
              </dd>
            </div>
            <div class="summary__stat summary__stat--private">
              <dt data-i18n="summary.private"></dt>
              <dd><span class="summary__number js-summary-private">0</span></dd>
            </div>
            <div class="summary__stat summary__stat--zero">
              <dt data-i18n="summary.permissions"></dt>
              <dd><span class="summary__number">0</span></dd>
            </div>
          </dl>
          <div class="summary__glance">
            <h3 class="summary__subtitle" data-i18n="summary.highlights"></h3>
            <ul class="summary__highlights js-summary-highlights"></ul>
          </div>
          <p class="summary__blocked js-summary-blocked" hidden></p>
          <p class="summary__note" data-i18n="summary.note"></p>
        </section>
      </div>

      <!-- CARDS: data-cards lists the cards painted by card.js into .js-cards -->
      <section class="area" data-cards="location" aria-labelledby="areaLocation">
        <header class="area__head">
          <span class="area__icon" aria-hidden="true"><span class="iconbg iconbg-location"></span></span>
          <div class="area__heading">
            <h2 tabindex="-1" id="areaLocation" class="area__title" data-i18n="header.location"></h2>
            <p class="area__lead" data-i18n="sections.location"></p>
          </div>
          <span class="area__count js-area-count"></span>
        </header>
        <div class="bento js-cards"></div>
      </section>

      <section
        class="area"
        data-cards="device screen orientation darkmode lang exit"
        aria-labelledby="areaInfo">
        <header class="area__head">
          <span class="area__icon" aria-hidden="true"><span class="iconbg iconbg-info"></span></span>
          <div class="area__heading">
            <h2 tabindex="-1" id="areaInfo" class="area__title" data-i18n="header.info"></h2>
            <p class="area__lead" data-i18n="sections.info"></p>
          </div>
          <span class="area__count js-area-count"></span>
        </header>
        <div class="bento js-cards"></div>
      </section>

      <section
        class="area"
        data-cards="timezone locale display preferences input keyboard"
        aria-labelledby="areaEnvironment">
        <header class="area__head">
          <span class="area__icon" aria-hidden="true"><span class="iconbg iconbg-timezone"></span></span>
          <div class="area__heading">
            <h2 tabindex="-1" id="areaEnvironment" class="area__title" data-i18n="header.environment"></h2>
            <p class="area__lead" data-i18n="sections.environment"></p>
          </div>
          <span class="area__count js-area-count"></span>
        </header>
        <div class="bento js-cards"></div>
      </section>

      <section class="area" data-cards="os browser" aria-labelledby="areaSoftware">
        <header class="area__head">
          <span class="area__icon" aria-hidden="true"><span class="iconbg iconbg-os"></span></span>
          <div class="area__heading">
            <h2 tabindex="-1" id="areaSoftware" class="area__title" data-i18n="header.software"></h2>
            <p class="area__lead" data-i18n="sections.software"></p>
          </div>
          <span class="area__count js-area-count"></span>
        </header>
        <div class="bento js-cards"></div>
      </section>

      <section class="area" data-cards="connection telco ip" aria-labelledby="areaConnection">
        <header class="area__head">
          <span class="area__icon" aria-hidden="true"><span class="iconbg iconbg-connection"></span></span>
          <div class="area__heading">
            <h2 tabindex="-1" id="areaConnection" class="area__title" data-i18n="header.connection"></h2>
            <p class="area__lead" data-i18n="sections.connection"></p>
          </div>
          <span class="area__count js-area-count"></span>
        </header>
        <div class="bento js-cards"></div>
      </section>

      <section class="area" data-cards="ram cpu gpu" aria-labelledby="areaHardware">
        <header class="area__head">
          <span class="area__icon" aria-hidden="true"><span class="iconbg iconbg-hardware"></span></span>
          <div class="area__heading">
            <h2 tabindex="-1" id="areaHardware" class="area__title" data-i18n="header.hardware"></h2>
            <p class="area__lead" data-i18n="sections.hardware"></p>
          </div>
          <span class="area__count js-area-count"></span>
        </header>
        <div class="bento js-cards"></div>
      </section>

      <section class="area" data-cards="battery" aria-labelledby="areaBattery">
        <header class="area__head">
          <span class="area__icon" aria-hidden="true"><span class="iconbg iconbg-battery"></span></span>
          <div class="area__heading">
            <h2 tabindex="-1" id="areaBattery" class="area__title" data-i18n="header.battery"></h2>
            <p class="area__lead" data-i18n="sections.battery"></p>
          </div>
          <span class="area__count js-area-count"></span>
        </header>
        <div class="bento js-cards"></div>
      </section>

      <section
        class="area"
        data-cards="canvas audio fonts voices"
        aria-labelledby="areaFingerprints">
        <header class="area__head">
          <span class="area__icon" aria-hidden="true"><span class="iconbg iconbg-canvas"></span></span>
          <div class="area__heading">
            <h2 tabindex="-1" id="areaFingerprints" class="area__title" data-i18n="header.fingerprints"></h2>
            <p class="area__lead" data-i18n="sections.fingerprints"></p>
          </div>
          <span class="area__count js-area-count"></span>
        </header>
        <div class="bento js-cards"></div>
      </section>

      <section
        class="area"
        data-cards="incognito adblock signals navigation"
        aria-labelledby="areaPrivacy">
        <header class="area__head">
          <span class="area__icon" aria-hidden="true"><span class="iconbg iconbg-incognito"></span></span>
          <div class="area__heading">
            <h2 tabindex="-1" id="areaPrivacy" class="area__title" data-i18n="header.privacy"></h2>
            <p class="area__lead" data-i18n="sections.privacy"></p>
          </div>
          <span class="area__count js-area-count"></span>
        </header>
        <div class="bento js-cards"></div>
      </section>

      <section class="area" data-cards="behaviour" aria-labelledby="areaBehaviour">
        <header class="area__head">
          <span class="area__icon" aria-hidden="true"><span class="iconbg iconbg-behaviour"></span></span>
          <div class="area__heading">
            <h2 tabindex="-1" id="areaBehaviour" class="area__title" data-i18n="header.behaviour"></h2>
            <p class="area__lead" data-i18n="sections.behaviour"></p>
          </div>
          <span class="area__count js-area-count"></span>
        </header>
        <div class="bento js-cards"></div>
      </section>

      <!-- ABOUT ME -->
      <section class="aboutme" aria-labelledby="areaAbout">
        <div class="aboutme__mark" aria-hidden="true"><span class="iconbg iconbg-project"></span></div>
        <div class="aboutme__body">
          <p class="eyebrow" data-i18n="aboutme.eyebrow"></p>
          <h2 tabindex="-1" id="areaAbout" class="aboutme__title" data-i18n="aboutme.heading"></h2>
          <div class="aboutme__text" data-i18n-html="aboutme.content1"></div>
          <div class="aboutme__text" data-i18n-html="aboutme.content2"></div>
        </div>
      </section>
    </template>

    <!-- FOOTER -->
    <template id="tpl-footer">
      <div class="footer__inner">
        <article class="footer__article">
          <p class="eyebrow" data-i18n="footer.eyebrow"></p>
          <h2 class="footer__title" data-i18n="footer.title"></h2>
          <div data-i18n-html="footer.content1"></div>
          <div data-i18n-html="footer.content2"></div>
        </article>
        <article class="footer__article footer__article--legal">
          <span class="footer__logo" aria-hidden="true"><span class="iconbg iconbg-logo"></span></span>
          <div data-i18n-html="footer.thanks"></div>
          <div data-i18n-html="footer.license"></div>
        </article>
      </div>
    </template>

    <!--
      CARD (generic). card.js sets:
        article         -> js-card-{type} card--{type}
        .iconbg          -> iconbg-{icon}
        value            -> js-apiValue-{type}
        description      -> js-apiDetail-{type}
        list             -> filled by webapi.js ([api, value] pairs or plain items)
        [data-i18n-card] -> {type}.title
        [data-i18n-plain] -> {type}.plain
    -->
    <template id="tpl-card">
      <article class="js-card card" data-state="pending">
        <header class="card__head">
          <span class="card__icon" aria-hidden="true"><span class="iconbg"></span></span>
          <h3 class="card__type" data-i18n-card></h3>
          <button type="button" class="card__more js-card-more">
            <span aria-hidden="true">?</span>
          </button>
        </header>
        <p class="card__value js-card-value" data-skeleton>...</p>
        <p class="card__description js-card-description"></p>
        <div class="card__lead"><span class="card__leadLabel"><span class="iconbg iconbg-project" aria-hidden="true"></span><span data-i18n="main.meaning"></span></span><p class="card__leadText" data-i18n-plain></p></div>
        <details class="card__proof">
          <summary data-i18n="main.proof"></summary>
          <ul class="card__api js-card-detail"></ul>
        </details>
        <div class="card__noSupport">
          <span class="card__noSupport__type" data-i18n="main.noSupportTitle"></span>
          <p class="card__noSupport__description" data-i18n="main.noSupport"></p>
        </div>
      </article>
    </template>

    <!-- CARD LOCATION -->
    <template id="tpl-card-location">
      <article class="js-card js-card-location card card--location" data-state="pending">
        <div class="card__map js-card-map">
          <span class="card__mapPlaceholder iconbg iconbg-location" aria-hidden="true"></span>
        </div>
        <div class="card__panel">
          <header class="card__head">
            <span class="card__icon" aria-hidden="true"><span class="iconbg iconbg-location"></span></span>
            <h3 class="card__type" data-i18n="location.title"></h3>
            <button type="button" class="card__more js-card-more">
              <span aria-hidden="true">?</span>
            </button>
          </header>
          <p class="card__value js-apiValue-city js-card-value" data-skeleton>...</p>
          <p class="card__description js-apiValue-country" data-skeleton>...</p>
          <div class="card__lead"><span class="card__leadLabel"><span class="iconbg iconbg-project" aria-hidden="true"></span><span data-i18n="main.meaning"></span></span><p class="card__leadText" data-i18n="location.plain"></p></div>
          <div class="card__noSupport">
            <span class="card__noSupport__type" data-i18n="main.noSupportTitle"></span>
            <p class="card__noSupport__description" data-i18n="main.noSupport"></p>
          </div>
        </div>
      </article>
    </template>

    <!-- CARD EXIT -->
    <template id="tpl-card-exit">
      <article class="js-card js-card-exit card card--exit" data-state="pending">
        <header class="card__head">
          <span class="card__icon" aria-hidden="true"><span class="iconbg iconbg-exit"></span></span>
          <h3 class="card__type" data-i18n="exit.eyebrow"></h3>
          <button type="button" class="card__more js-card-more">
            <span aria-hidden="true">?</span>
          </button>
        </header>
        <p class="card__value card__value--s js-apiValue-exitTitle" data-i18n="exit.severaltimes"></p>
        <ul class="card__visits js-apiValue-exit js-card-value" data-skeleton></ul>
        <div class="card__lead"><span class="card__leadLabel"><span class="iconbg iconbg-project" aria-hidden="true"></span><span data-i18n="main.meaning"></span></span><p class="card__leadText" data-i18n="exit.plain"></p></div>
        <div class="card__noSupport">
          <span class="card__noSupport__type" data-i18n="main.noSupportTitle"></span>
          <p class="card__noSupport__description" data-i18n="main.noSupport"></p>
        </div>
      </article>
    </template>

    <!-- CARD CONNECTION -->
    <template id="tpl-card-connection">
      <article class="js-card js-card-connection card card--connection" data-state="pending">
        <header class="card__head">
          <span class="card__icon" aria-hidden="true"><span class="iconbg iconbg-connection"></span></span>
          <h3 class="card__type" data-i18n="connection.title"></h3>
          <span class="badge" data-i18n="main.estimate"></span>
          <button type="button" class="card__more js-card-more">
            <span aria-hidden="true">?</span>
          </button>
        </header>
        <p class="card__value js-apiValue-connection-mbps js-card-value" data-skeleton>...</p>
        <p class="card__description js-apiValue-connection-type"></p>
        <div class="card__lead"><span class="card__leadLabel"><span class="iconbg iconbg-project" aria-hidden="true"></span><span data-i18n="main.meaning"></span></span><p class="card__leadText" data-i18n="connection.plain"></p></div>
        <div class="card__noSupport">
          <span class="card__noSupport__type" data-i18n="main.noSupportTitle"></span>
          <p class="card__noSupport__description" data-i18n="main.noSupport"></p>
        </div>
      </article>
    </template>

    <!-- CARD BATTERY -->
    <template id="tpl-card-battery">
      <article class="js-card js-card-battery card card--battery" data-state="pending">
        <header class="card__head">
          <span class="card__icon" aria-hidden="true"><span class="iconbg iconbg-battery"></span></span>
          <h3 class="card__type" data-i18n="battery.title"></h3>
          <button type="button" class="card__more js-card-more">
            <span aria-hidden="true">?</span>
          </button>
        </header>
        <!-- WIDGET BATTERY (batteryAPI.js) -->
        <div class="battery">
          <div class="battery__icon" data-level="0%" aria-hidden="true"></div>
          <ul class="battery__info__list">
            <li class="battery__info__item">
              <span class="battery__info__title" data-i18n="battery.type.mode"></span>
              <span class="battery__info__value battery__info__value--mode js-battery-mode">-</span>
            </li>
            <li class="battery__info__item">
              <span class="battery__info__title" data-i18n="battery.type.level"></span>
              <span class="battery__info__value js-battery-level js-card-value" data-skeleton>-</span>
            </li>
            <li class="battery__info__item">
              <span class="battery__info__title" data-i18n="battery.type.charged"></span>
              <span class="battery__info__value js-battery-chargedtimme">-</span>
            </li>
            <li class="battery__info__item">
              <span class="battery__info__title" data-i18n="battery.type.remaining"></span>
              <span class="battery__info__value js-battery-dischargingtime">-</span>
            </li>
          </ul>
        </div>
        <div class="card__lead"><span class="card__leadLabel"><span class="iconbg iconbg-project" aria-hidden="true"></span><span data-i18n="main.meaning"></span></span><p class="card__leadText" data-i18n="battery.plain"></p></div>
        <div class="card__noSupport">
          <span class="card__noSupport__type" data-i18n="main.noSupportTitle"></span>
          <p class="card__noSupport__description" data-i18n="main.noSupport"></p>
        </div>
      </article>
    </template>

    <!-- CARD FINGERPRINT (Your ID) -->
    <template id="tpl-card-fingerprint">
      <article class="js-card js-card-fingerprint card card--fingerprint" data-state="pending">
        <header class="card__head">
          <span class="card__icon" aria-hidden="true"><span class="iconbg iconbg-fingerprint"></span></span>
          <h3 class="card__type" data-i18n="fingerprint.title"></h3>
          <button type="button" class="card__more js-card-more">
            <span aria-hidden="true">?</span>
          </button>
        </header>
        <p class="card__value card__hash js-apiValue-fingerprint js-card-value" data-skeleton>…</p>
        <div class="card__lead"><span class="card__leadLabel"><span class="iconbg iconbg-project" aria-hidden="true"></span><span data-i18n="main.meaning"></span></span><p class="card__leadText" data-i18n="fingerprint.plain"></p></div>
        <p class="card__description" data-i18n="fingerprint.type.note"></p>
        <details class="card__proof">
          <summary data-i18n="main.proof"></summary>
          <ul class="card__api js-card-detail"></ul>
        </details>
        <div class="card__noSupport">
          <span class="card__noSupport__type" data-i18n="main.noSupportTitle"></span>
          <p class="card__noSupport__description" data-i18n="main.noSupport"></p>
        </div>
      </article>
    </template>

    <!-- CARD CANVAS -->
    <template id="tpl-card-canvas">
      <article class="js-card js-card-canvas card card--canvas" data-state="pending">
        <header class="card__head">
          <span class="card__icon" aria-hidden="true"><span class="iconbg iconbg-canvas"></span></span>
          <h3 class="card__type" data-i18n="canvas.title"></h3>
          <button type="button" class="card__more js-card-more">
            <span aria-hidden="true">?</span>
          </button>
        </header>
        <img class="card__canvas js-canvas-image" alt="" width="280" height="64" />
        <p class="card__value card__hash js-apiValue-canvas js-card-value" data-skeleton>…</p>
        <div class="card__lead"><span class="card__leadLabel"><span class="iconbg iconbg-project" aria-hidden="true"></span><span data-i18n="main.meaning"></span></span><p class="card__leadText" data-i18n="canvas.plain"></p></div>
        <p class="card__description" data-i18n="canvas.type.caption"></p>
        <details class="card__proof">
          <summary data-i18n="main.proof"></summary>
          <ul class="card__api js-card-detail"></ul>
        </details>
        <div class="card__noSupport">
          <span class="card__noSupport__type" data-i18n="main.noSupportTitle"></span>
          <p class="card__noSupport__description" data-i18n="main.noSupport"></p>
        </div>
      </article>
    </template>

    <!-- CARD BEHAVIOUR -->
    <template id="tpl-card-behaviour">
      <article class="js-card js-card-behaviour card card--behaviour" data-state="ready">
        <header class="card__head">
          <span class="card__icon" aria-hidden="true"><span class="iconbg iconbg-behaviour"></span></span>
          <h3 class="card__type" data-i18n="behaviour.title"></h3>
          <button type="button" class="card__more js-card-more">
            <span aria-hidden="true">?</span>
          </button>
        </header>
        <div class="behaviour">
          <div class="behaviour__screen">
            <canvas class="behaviour__map js-behaviour-map" aria-hidden="true"></canvas>
          </div>
          <ul class="behaviour__stats">
            <li><span data-i18n="behaviour.type.moves"></span><b class="js-behaviour-moves">0</b></li>
            <li><span data-i18n="behaviour.type.clicks"></span><b class="js-behaviour-clicks">0</b></li>
            <li><span data-i18n="behaviour.type.scroll"></span><b class="js-behaviour-scroll">0%</b></li>
            <li><span data-i18n="behaviour.type.keys"></span><b class="js-behaviour-keys">0</b></li>
            <li><span data-i18n="behaviour.type.hidden"></span><b class="js-behaviour-hidden">0</b></li>
            <li><span data-i18n="behaviour.type.time"></span><b class="js-behaviour-time">0:00</b></li>
          </ul>
        </div>
        <div class="card__lead"><span class="card__leadLabel"><span class="iconbg iconbg-project" aria-hidden="true"></span><span data-i18n="main.meaning"></span></span><p class="card__leadText" data-i18n="behaviour.plain"></p></div>
        <p class="card__description" data-i18n="behaviour.type.caption"></p>
        <div class="card__noSupport">
          <span class="card__noSupport__type" data-i18n="main.noSupportTitle"></span>
          <p class="card__noSupport__description" data-i18n="main.noSupport"></p>
        </div>
      </article>
    </template>

    <!-- MODAL: native <dialog>, opened with showModal() by caimodal.js -->
    <template id="tpl-caimodal">
      <dialog class="caimodal js-caimodal" aria-labelledby="caimodalTitle">
        <div class="caimodalBox">
          <header class="caimodalBox__header">
            <h2 id="caimodalTitle" class="caimodalBox__header__title js-caimodal-title"></h2>
            <button
              class="caimodalBox__btnClose"
              type="button"
              data-caimodal-action="close"
              data-i18n-attr="aria-label:global.close;title:global.close">
              <span class="iconbg iconbg-close" aria-hidden="true"></span>
            </button>
          </header>
          <div class="caimodalBox__main js-caimodal-main"></div>
          <footer class="caimodalBox__footer js-caimodal-footer"></footer>
        </div>
      </dialog>
    </template>

    <!-- SHARE -->
    <template id="tpl-share-btn">
      <button
        type="button"
        class="sharetime__btn js-share-native"
        data-i18n-attr="title:global.share">
        <span class="iconbg iconbg-share" aria-hidden="true"></span>
        <span class="sharetime__label" data-i18n="global.share"></span>
      </button>
    </template>

    <template id="tpl-share-item">
      <li class="shareTimeList__item">
        <a class="shareTimeList__item__link" target="_blank" rel="noopener noreferrer">
          <span class="iconbg" aria-hidden="true"></span>
          <span class="shareTimeList__label"></span>
        </a>
      </li>
    </template>

    <!-- PROGRESS -->
    <template id="tpl-loading">
      <div
        class="loadingPage__bar js-loading-bar"
        role="progressbar"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
        data-i18n-attr="aria-label:global.loading">
        <span class="loadingPage__fill"></span>
      </div>
    </template>
  </body>
</html>
