    <!-- Colour mode: the visitor's choice, or else the system's. Applied before the first paint (no flash) -->
    <script>
      {
        let mode;
        try {
          mode = localStorage.getItem("ikay-theme");
        } catch {}
        if (mode !== "light" && mode !== "dark" && mode !== "high-contrast") {
          mode = matchMedia("(prefers-contrast: more)").matches ? "high-contrast" : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.mode = mode;
      }
    </script>
    <!-- The texts of the page's language, fetched while the scripts download. Same rule as negotiate() in i18n.js -->
    <script>
      {
        const langs = ["es", "en", "ar"];
        let lang;
        try {
          lang = localStorage.getItem("ikay-sessionLang");
        } catch {}
        if (!langs.includes(lang)) {
          const preferred = navigator.languages?.length ? navigator.languages : [navigator.language];
          lang = preferred.map((tag) => tag.split("-")[0].toLowerCase()).find((code) => langs.includes(code)) ?? "en";
        }
        document.head.insertAdjacentHTML("beforeend", `<link rel="preload" href="assets/locales/${lang}.json" as="fetch" crossorigin />`);
      }
    </script>

    <!--
      CARD (generic). card.js sets:
        article            -> js-card-{type} card--{type}
        [data-sentence]    -> "{type}.sentence" around the bold value: the heading
        value (strong)     -> js-apiValue-{type}
        description        -> js-apiDetail-{type}
        list               -> filled by webapi.js ([api, value] pairs or plain items)
        [data-i18n-plain]  -> {type}.plain
        .js-card-status    -> checking / not protected / protected (by state)
        .js-card-protected -> "Your browser doesn't share ..." sentence
      data-mirror="selector": copies the text of another element of the card.
    -->
    <template id="tpl-card">
      <article class="js-card card" data-state="pending">
        <header class="card__head">
          <span class="card__status">

            <span class="card__leadLabel"><span class="iconbg iconbg-project" aria-hidden="true"></span><span data-i18n="main.meaning"></span></span>
            <p class="card__leadText" data-i18n="location.plain"></p>

        <h3 class="card__sentence" data-sentence="exit.sentence">
          <strong class="card__value js-exit-count" data-skeleton>…</strong>

        <p class="card__description js-apiValue-exitTitle" data-i18n="exit.severaltimes"></p>
        <ul class="card__visits js-apiValue-exit js-card-value" data-skeleton></ul>
        <div class="card__lead">

    <!-- CARD CONNECTION -->
    <template id="tpl-card-connection">
      <article class="js-card js-card-connection card card--connection" data-state="pending">
        <header class="card__head">
          <span class="card__status">

          <span class="card__leadLabel"><span class="iconbg iconbg-project" aria-hidden="true"></span><span data-i18n="main.meaning"></span></span>

    <!-- CARD BATTERY -->
    <template id="tpl-card-battery">
      <article class="js-card js-card-battery card card--battery" data-state="pending">
        <header class="card__head">
          <span class="card__status">
            <span class="card__icon" aria-hidden="true"><span class="iconbg iconbg-status"></span></span>
            <span class="card__statusText js-card-status"></span>
          </span>
          <button type="button" class="card__more js-card-more">
            <span aria-hidden="true">?</span>
          </button>
        </header>
        <h3 class="card__sentence" data-sentence="battery.sentence">
          <strong class="card__value" data-mirror=".js-battery-level" data-skeleton>-</strong>
        </h3>
        <!-- WIDGET BATTERY (batteryAPI.js sets --level, data-state and the texts) -->
        <div class="battery">
          <div class="battery__gauge">
            <div class="battery__icon" aria-hidden="true"><span class="battery__fill"></span></div>
            <span class="battery__bolt iconbg iconbg-bolt" aria-hidden="true"></span>
            <span class="battery__percent js-battery-level js-card-value" data-skeleton>-</span>
          </div>
          <dl class="battery__info__list">
            <div class="battery__info__item">
              <dt class="battery__info__title" data-i18n="battery.type.mode"></dt>
              <dd class="battery__info__value battery__info__value--mode js-battery-mode">—</dd>
            </div>
            <div class="battery__info__item">
              <dt class="battery__info__title" data-i18n="battery.type.charged"></dt>
              <dd class="battery__info__value js-battery-chargedtimme">—</dd>
            </div>
            <div class="battery__info__item">
              <dt class="battery__info__title" data-i18n="battery.type.remaining"></dt>
              <dd class="battery__info__value js-battery-dischargingtime">—</dd>
            </div>
          </dl>
        </div>
        <div class="card__lead">
          <span class="card__leadLabel"><span class="iconbg iconbg-project" aria-hidden="true"></span><span data-i18n="main.meaning"></span></span>
          <p class="card__leadText" data-i18n="battery.plain"></p>
        </div>
        <div class="card__noSupport">
          <h3 class="card__protected js-card-protected"></h3>
          <p class="card__noSupport__description" data-i18n="main.noSupport"></p>
        </div>
      </article>
    </template>

    <template id="tpl-card-fingerprint">
      <article class="js-card js-card-fingerprint card card--fingerprint" data-state="pending">

            <span class="card__icon" aria-hidden="true"><span class="iconbg iconbg-status"></span></span>

    <template id="tpl-card-canvas">

    <!-- CARD BEHAVIOUR -->
    <template id="tpl-card-behaviour">
      <article class="js-card js-card-behaviour card card--behaviour" data-state="ready">
        <header class="card__head">
          <span class="card__status">
            <span class="card__icon" aria-hidden="true"><span class="iconbg iconbg-status"></span></span>
            <span class="card__statusText js-card-status"></span>
          </span>
          <button type="button" class="card__more js-card-more">
            <span aria-hidden="true">?</span>
          </button>
        </header>
        <h3 class="card__sentence" data-sentence="behaviour.sentence">
          <strong class="card__value" data-mirror=".js-behaviour-moves">0</strong>
        </h3>
        <div class="behaviour">
          <div class="behaviour__screen">
            <canvas class="behaviour__map js-behaviour-map" aria-hidden="true"></canvas>
          </div>
          <ul class="behaviour__stats">
            <li><span data-i18n="behaviour.type.moves"></span><b class="js-behaviour-moves">0</b></li>
            <li><span data-i18n="behaviour.type.clicks"></span><b class="js-behaviour-clicks">0</b></li>
            <li><span data-i18n="behaviour.type.scroll"></span><b class="js-behaviour-scroll">0%</b></li>
            <li><span data-i18n="behaviour.type.keys"></span><b class="js-behaviour-keys">0</b></li>
            <li><span data-i18n="behaviour.type.hidden"></span><b class="js-behaviour-hidden">0</b></li>
            <li><span data-i18n="behaviour.type.time"></span><b class="js-behaviour-time">0:00</b></li>
          </ul>
        </div>
        <p class="card__description" data-i18n="behaviour.type.caption"></p>
        <div class="card__lead">
          <span class="card__leadLabel"><span class="iconbg iconbg-project" aria-hidden="true"></span><span data-i18n="main.meaning"></span></span>
          <p class="card__leadText" data-i18n="behaviour.plain"></p>
        </div>
        <div class="card__noSupport">
          <h3 class="card__protected js-card-protected"></h3>
          <p class="card__noSupport__description" data-i18n="main.noSupport"></p>
        </div>

    <!-- MODAL: native <dialog>, opened with showModal() by caimodal.js -->
    <template id="tpl-caimodal">
      <dialog class="caimodal js-caimodal" aria-labelledby="caimodalTitle">
        <div class="caimodalBox">
          <header class="caimodalBox__header">
            <h2 id="caimodalTitle" class="caimodalBox__header__title js-caimodal-title"></h2>
            <button
              class="caimodalBox__btnClose"
              type="button"
              data-caimodal-action="close"
              data-i18n-attr="aria-label:global.close;title:global.close">
              <span class="iconbg iconbg-close" aria-hidden="true"></span>
            </button>
          </header>
          <div class="caimodalBox__main js-caimodal-main"></div>
          <footer class="caimodalBox__footer js-caimodal-footer"></footer>
        </div>
      </dialog>
    </template>

    <!-- SHARE -->
    <template id="tpl-share-btn">
      <button
        type="button"
        class="sharetime__btn js-share-native"
        data-i18n-attr="title:global.share">
        <span class="iconbg iconbg-share" aria-hidden="true"></span>
        <span class="sharetime__label" data-i18n="global.share"></span>
      </button>
    </template>

    <template id="tpl-share-item">
      <li class="shareTimeList__item">
        <a class="shareTimeList__item__link" target="_blank" rel="noopener noreferrer">
          <span class="iconbg" aria-hidden="true"></span>
          <span class="shareTimeList__label"></span>
        </a>
      </li>
    </template>

    <!-- PROGRESS -->
    <template id="tpl-loading">
      <div
        class="loadingPage__bar js-loading-bar"
        role="progressbar"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
        data-i18n-attr="aria-label:global.loading">
        <span class="loadingPage__fill"></span>
      </div>
    </template>
